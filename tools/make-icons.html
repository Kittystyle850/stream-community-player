<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Genera Icone</title></head>
<body style="font-family: system-ui; padding: 20px; background: #1b1c1f; color: #fff;">
  <h1>Genera Icone Stream Community Player</h1>
  <p>Clicca i pulsanti sotto per scaricare le 3 icone. Salvali nella cartella <code>icons/</code>.</p>
  <div id="preview" style="display: flex; gap: 20px; align-items: end; margin: 20px 0;"></div>
  <button id="dl16">Scarica icon16.png</button>
  <button id="dl48">Scarica icon48.png</button>
  <button id="dl128">Scarica icon128.png</button>

  <script>
  function drawIcon(size) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const ctx = c.getContext("2d");

    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, "#1565c0");
    grad.addColorStop(1, "#42a5f5");
    ctx.fillStyle = grad;
    ctx.beginPath();
    const r = size * 0.18;
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    const cx = size / 2, cy = size / 2;
    const t = size * 0.32;
    ctx.beginPath();
    ctx.moveTo(cx - t * 0.6, cy - t);
    ctx.lineTo(cx + t * 0.8, cy);
    ctx.lineTo(cx - t * 0.6, cy + t);
    ctx.closePath();
    ctx.fill();

    return c;
  }

  for (const size of [16, 48, 128]) {
    const canvas = drawIcon(size);
    const container = document.getElementById("preview");
    const wrap = document.createElement("div");
    wrap.style.textAlign = "center";
    canvas.style.border = "1px solid rgba(255,255,255,.2)";
    canvas.style.borderRadius = "8px";
    wrap.appendChild(canvas);
    wrap.appendChild(document.createElement("br"));
    const lbl = document.createElement("span");
    lbl.textContent = size + "×" + size;
    lbl.style.fontSize = "12px";
    lbl.style.opacity = ".6";
    wrap.appendChild(lbl);
    container.appendChild(wrap);

    document.getElementById("dl" + size).addEventListener("click", () => {
      canvas.toBlob((blob) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "icon" + size + ".png";
        a.click();
      });
    });
  }
  </script>
</body>
</html>
