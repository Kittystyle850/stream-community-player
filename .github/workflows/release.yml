name: Auto Release & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Skip se il commit è stato fatto dal bot (evita loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verifica struttura
        run: |
          test -f manifest.json
          test -f src/background.js
          test -f src/content.js
          test -f src/content.css
          test -f src/popup.html
          test -f src/popup.js
          test -d icons
          test -f icons/icon16.png
          test -f icons/icon48.png
          test -f icons/icon128.png
          echo "✅ Struttura OK"

      - name: Incrementa versione automaticamente
        id: bump
        run: |
          # Leggi il messaggio di commit
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          # Determina il tipo di bump dal messaggio di commit
          BUMP_TYPE="patch"
          if echo "$COMMIT_MSG" | grep -qi "\[major\]"; then
            BUMP_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -qi "\[minor\]"; then
            BUMP_TYPE="minor"
          fi
          echo "📈 Tipo di bump: $BUMP_TYPE"

          # Calcola nuova versione
          OLD_VERSION=$(node -p "require('./manifest.json').version")
          NEW_VERSION=$(node -e "
            const v = '$OLD_VERSION'.split('.').map(Number);
            const type = '$BUMP_TYPE';
            if (type === 'major') console.log((v[0]+1) + '.0.0');
            else if (type === 'minor') console.log(v[0] + '.' + (v[1]+1) + '.0');
            else console.log(v[0] + '.' + v[1] + '.' + (v[2]+1));
          ")

          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versione: $OLD_VERSION → $NEW_VERSION"

          # Aggiorna manifest.json
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = '$NEW_VERSION';
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "

      - name: Commit e push della nuova versione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin main

      - name: Crea ZIP per il rilascio
        run: |
          zip -r stream-community-player.zip \
            manifest.json \
            src/ \
            icons/

      - name: Installa web-ext
        run: npm install -g web-ext

      - name: Firma e pubblica su Firefox AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          web-ext sign \
            --source-dir=. \
            --artifacts-dir=web-ext-artifacts \
            --channel=listed \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET" \
            --no-config-discovery \
            --ignore-files=".github/**" "tools/**" "install.html" "index.html" "README.md" "LICENSE" "CHANGELOG.md" "PRIVACY.md" "*.zip" "web-ext-artifacts/**" ".gitignore"

      - name: Crea tag automatico
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✅ Tag $TAG creato"

      - name: Crea GitHub Release con allegati
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: "Stream Community Player v${{ steps.bump.outputs.version }}"
          files: |
            stream-community-player.zip
            web-ext-artifacts/*.xpi
          generate_release_notes: true
          body: |
            ## 🎬 Stream Community Player v${{ steps.bump.outputs.version }}

            ### 📦 Installazione

            **Firefox** (automatica):
            👉 [Installa da Firefox AMO](https://addons.mozilla.org/firefox/addon/stream-community-player/)

            **Brave / Chrome / Edge** (manuale):
            1. Scarica `stream-community-player.zip` qui sotto
            2. Estrai in una cartella
            3. Vai su `chrome://extensions` o `brave://extensions`
            4. Attiva **Modalità sviluppatore**
            5. Clicca **Carica estensione non pacchettizzata**
            6. Seleziona la cartella

            ### ✨ Cosa c'è di nuovo
            Vedi [CHANGELOG.md](https://github.com/Kittystyle850/stream-community-player/blob/main/CHANGELOG.md)

            ### 🔄 Aggiornamento automatico
            Se hai già l'estensione installata, riceverai l'aggiornamento automaticamente entro 24 ore.
