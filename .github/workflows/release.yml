name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verifica struttura
        run: |
          test -f manifest.json
          test -f src/background.js
          test -f src/content.js
          test -f src/content.css
          test -f src/popup.html
          test -f src/popup.js
          test -d icons
          test -f icons/icon16.png
          test -f icons/icon48.png
          test -f icons/icon128.png
          echo "✅ Struttura OK"

      - name: Leggi versione dal manifest
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versione: $VERSION"

      - name: Verifica tag corrisponde a versione
        run: |
          TAG="${{ github.ref_name }}"
          TAG_NO_V="${TAG#v}"
          MANIFEST_V="${{ steps.version.outputs.version }}"
          if [ "$TAG_NO_V" != "$MANIFEST_V" ]; then
            echo "❌ Tag ($TAG_NO_V) diverso da manifest version ($MANIFEST_V)"
            exit 1
          fi
          echo "✅ Tag e versione corrispondono"

      - name: Crea ZIP (solo file necessari per AMO)
        run: |
          zip -r stream-community-player.zip \
            manifest.json \
            src/ \
            icons/

      - name: Installa web-ext
        run: npm install -g web-ext

      - name: Firma e pubblica su Firefox AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          web-ext sign \
            --source-dir=. \
            --artifacts-dir=web-ext-artifacts \
            --channel=listed \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET" \
            --no-config-discovery \
            --ignore-files=".github/**" "tools/**" "install.html" "README.md" "LICENSE" "CHANGELOG.md" "PRIVACY.md" "*.zip" "web-ext-artifacts/**" ".gitignore"

      - name: Crea GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stream-community-player.zip
            web-ext-artifacts/*.xpi
          generate_release_notes: true
          body: |
            ## 🎬 Stream Community Player v${{ steps.version.outputs.version }}

            ### 📦 Installazione

            **Firefox** (automatica):
            👉 [Installa da AMO](https://addons.mozilla.org/firefox/addon/stream-community-player/)

            **Brave / Chrome / Edge** (manuale):
            1. Scarica `stream-community-player.zip` qui sotto
            2. Estrai in una cartella
            3. Vai su `chrome://extensions` o `brave://extensions`
            4. Attiva **Modalità sviluppatore**
            5. Clicca **Carica estensione non pacchettizzata**
            6. Seleziona la cartella

            ### ✨ Cosa c'è di nuovo
            Vedi [CHANGELOG.md](CHANGELOG.md)
