name: Auto Release & Publish

on:
  push:
    branches:
      - main
    paths:
      - 'manifest.json'
      - 'src/**'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verifica se la versione è nuova
        id: check
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "ℹ️ Tag v$VERSION già esistente — skip release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Nuova versione rilevata: v$VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verifica struttura
        run: |
          test -f manifest.json
          test -f src/background.js
          test -f src/content.js
          test -f src/content.css
          test -f src/popup.html
          test -f src/popup.js
          test -d icons
          test -f icons/icon16.png
          test -f icons/icon48.png
          test -f icons/icon128.png
          echo "✅ Struttura OK"

      - name: Leggi versione
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Versione: $VERSION"

      - name: Crea ZIP per il rilascio
        run: |
          zip -r stream-community-player.zip \
            manifest.json \
            src/ \
            icons/

      - name: Installa web-ext
        run: npm install -g web-ext

      - name: Firma e pubblica su Firefox AMO
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          web-ext sign \
            --source-dir=. \
            --artifacts-dir=web-ext-artifacts \
            --channel=listed \
            --api-key="$WEB_EXT_API_KEY" \
            --api-secret="$WEB_EXT_API_SECRET" \
            --no-config-discovery \
            --ignore-files=".github/**" "tools/**" "install.html" "README.md" "LICENSE" "CHANGELOG.md" "PRIVACY.md" "*.zip" "web-ext-artifacts/**" ".gitignore"

      - name: Configura Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Crea tag automatico
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✅ Tag $TAG creato e pushato"

      - name: Crea GitHub Release con allegati
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Stream Community Player v${{ steps.version.outputs.version }}"
          files: |
            stream-community-player.zip
            web-ext-artifacts/*.xpi
          generate_release_notes: true
          body: |
            ## 🎬 Stream Community Player v${{ steps.version.outputs.version }}

            ### 📦 Installazione

            **Firefox** (automatica):
            👉 [Installa da Firefox AMO](https://addons.mozilla.org/firefox/addon/stream-community-player/)

            **Brave / Chrome / Edge** (manuale):
            1. Scarica `stream-community-player.zip` qui sotto
            2. Estrai in una cartella
            3. Vai su `chrome://extensions` o `brave://extensions`
            4. Attiva **Modalità sviluppatore**
            5. Clicca **Carica estensione non pacchettizzata**
            6. Seleziona la cartella

            ### ✨ Cosa c'è di nuovo
            Vedi [CHANGELOG.md](https://github.com/Kittystyle850/stream-community-player/blob/main/CHANGELOG.md)
