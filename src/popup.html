<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Stream Community Player</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 280px; margin: 0; padding: 16px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #1b1c1f; color: #fff;
  }
  h1 {
    font-size: 15px; margin: 0 0 4px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  h1::before {
    content: "▶"; color: #42a5f5; font-size: 18px;
  }
  .sub { font-size: 11px; opacity: .5; margin-bottom: 12px; }
  label {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; font-size: 13px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  label:last-of-type { border-bottom: none; }
  input[type="checkbox"] { accent-color: #42a5f5; transform: scale(1.2); cursor: pointer; }
  .status {
    padding: 10px; border-radius: 8px; font-size: 12px;
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .status.ok { background: rgba(76,175,80,.15); color: #81c784; }
  .status.warn { background: rgba(255,152,0,.15); color: #ffb74d; }
  .footer {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.1);
    font-size: 11px; opacity: .5; text-align: center;
  }
  .footer a { color: #42a5f5; text-decoration: none; }
</style>
</head>
<body>
  <h1>Stream Community Player</h1>
  <div class="sub">Player stile Netflix per SC / VixCloud</div>

  <div id="status" class="status">⏳ Verifica in corso...</div>

  <label>Fullscreen automatico <input type="checkbox" id="autoFullscreen"></label>
  <label>Audio automatico <input type="checkbox" id="autoUnmute"></label>
  <label>Autoplay iniziale <input type="checkbox" id="autoPlayInitial"></label>
  <label>Prossimo episodio <input type="checkbox" id="autoNext"></label>
  <label>Ripresa automatica <input type="checkbox" id="resume"></label>

  <div class="footer">
    v<span id="version">1.0.0</span> ·
    <a href="https://github.com/Kittystyle850/stream-community-player" target="_blank" rel="noopener noreferrer">GitHub</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
